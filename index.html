<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A live NASA EONET dashboard for exploring natural events around the world."
    />
    <title>EarthPulse | NASA Natural Events Explorer</title>
    <link rel="preconnect" href="https://eonet.gsfc.nasa.gov" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQFto180B8f8Soj2UecipSh4jM4K0qo="
      crossorigin=""
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="skip-link" href="#eventList">Skip to events</a>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">EP</span>
          <div>
            <p class="eyebrow">NASA EONET</p>
            <h1>EarthPulse</h1>
          </div>
        </div>
        <div class="api-pill" id="apiStatus" role="status">Ready</div>
      </header>

      <section class="controls" aria-label="Event filters">
        <label class="control">
          <span>Category</span>
          <select id="categorySelect">
            <option value="">All categories</option>
          </select>
        </label>

        <fieldset class="status-control">
          <legend>Status</legend>
          <label>
            <input type="radio" name="status" value="open" checked />
            <span>Open</span>
          </label>
          <label>
            <input type="radio" name="status" value="all" />
            <span>All</span>
          </label>
          <label>
            <input type="radio" name="status" value="closed" />
            <span>Closed</span>
          </label>
        </fieldset>

        <label class="control range-control">
          <span>Days</span>
          <input id="daysRange" type="range" min="1" max="365" step="1" value="45" />
          <output id="daysOutput" for="daysRange">45</output>
        </label>

        <label class="control">
          <span>Limit</span>
          <select id="limitSelect">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </label>

        <button class="primary-button" id="refreshBtn" type="button">Refresh</button>
      </section>

      <main class="dashboard">
        <section class="map-panel" aria-label="Natural events map">
          <div id="map"></div>
        </section>

        <aside class="side-panel" aria-label="Natural events list">
          <section class="metrics" aria-label="Event summary">
            <div class="metric">
              <span>Events</span>
              <strong id="eventCount">0</strong>
            </div>
            <div class="metric">
              <span>Mapped</span>
              <strong id="mappedCount">0</strong>
            </div>
            <div class="metric">
              <span>Top Type</span>
              <strong id="topCategory">None</strong>
            </div>
            <div class="metric">
              <span>Latest</span>
              <strong id="latestDate">None</strong>
            </div>
          </section>

          <div class="search-row">
            <label class="search-control">
              <span>Search</span>
              <input id="searchInput" type="search" placeholder="Event name or source" />
            </label>
            <button class="ghost-button" id="clearSearchBtn" type="button">Clear</button>
          </div>

          <ul class="event-list" id="eventList" aria-live="polite"></ul>
        </aside>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="app.js?v=4" defer></script>
  </body>
</html>
